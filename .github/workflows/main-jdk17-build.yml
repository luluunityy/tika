name: main jdk17 build

on:
  pull_request:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'

jobs:
  semgrep:
    name: Analyse de Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Lancer Semgrep
        run: |
          semgrep scan --config p/java --metrics=off \
            --baseline-commit "$(git merge-base origin/main HEAD)" \
            --error \
            --json-output=semgrep-report.json

      - name: Sauvegarde du rapport Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
